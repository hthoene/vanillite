name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: smaller caches, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal --component clippy
      # The Vanilla data the build extracts from Mojang's server jars (#213): the current version
      # and the older ones of vanillite-multiversion, restored instead of extracted again (about
      # 2.5 min per job). Only the codegen job saves it: it extracts every pinned version, so the
      # entry is complete (a job that saved first could leave the older versions out).
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vanillite/vanilla-data
          key: vanilla-data-v2-${{ hashFiles('data/**/version.toml', 'tools/extractor/src/**/*.java', 'crates/vanillite-datagen/src/**') }}
          restore-keys: vanilla-data-v2-
      - uses: Swatinem/rust-cache@v2
        with:
          # Dev (and manual runs, to measure a branch warm) write the cache; others read it.
          save-if: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The tests run in parallel jobs: the world generation goldens and the game and world crates
  # (menu fuzz and chunk level tests) in two parts each, the test harness (parity scenarios) in
  # three parts and all other crates. Together they run every test of the workspace; the doc tests and the
  # codegen checks run in a job of their own.
  test:
    name: Tests (all other crates)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      # The Vanilla data the build extracts from Mojang's server jars (#213): the current version
      # and the older ones of vanillite-multiversion, restored instead of extracted again (about
      # 2.5 min per job). Only the codegen job saves it: it extracts every pinned version, so the
      # entry is complete (a job that saved first could leave the older versions out).
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vanillite/vanilla-data
          key: vanilla-data-v2-${{ hashFiles('data/**/version.toml', 'tools/extractor/src/**/*.java', 'crates/vanillite-datagen/src/**') }}
          restore-keys: vanilla-data-v2-
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}
      # The workspace crates through sccache (GitHub cache): crates a change does not touch, above
      # all the optimised world generation, come from the cache instead of being rebuilt.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # The Vanilla data pack the tests extract from the pinned server jar. After rust-cache so
      # that its post step saves before rust-cache cleans target/ (which drops this directory).
      - uses: actions/cache@v4
        with:
          path: target/vanilla-cache
          key: vanilla-pack-${{ hashFiles('data/vanilla/version.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: cargo nextest run --workspace --exclude vanillite-worldgen --exclude vanillite-game --exclude vanillite-world --exclude vanillite-test --all-features --locked --profile ci --no-tests=warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit
          path: target/nextest/ci/junit.xml

  test-game:
    name: Tests (game and world ${{ matrix.slice }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      # The Vanilla data the build extracts from Mojang's server jars (#213): the current version
      # and the older ones of vanillite-multiversion, restored instead of extracted again (about
      # 2.5 min per job). Only the codegen job saves it: it extracts every pinned version, so the
      # entry is complete (a job that saved first could leave the older versions out).
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vanillite/vanilla-data
          key: vanilla-data-v2-${{ hashFiles('data/**/version.toml', 'tools/extractor/src/**/*.java', 'crates/vanillite-datagen/src/**') }}
          restore-keys: vanilla-data-v2-
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}
      # The workspace crates through sccache (GitHub cache): crates a change does not touch, above
      # all the optimised world generation, come from the cache instead of being rebuilt.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # The Vanilla data pack the tests extract from the pinned server jar. After rust-cache so
      # that its post step saves before rust-cache cleans target/ (which drops this directory).
      - uses: actions/cache@v4
        with:
          path: target/vanilla-cache
          key: vanilla-pack-${{ hashFiles('data/vanilla/version.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: >-
          cargo nextest run -p vanillite-game -p vanillite-world --all-features --locked --profile ci
          --no-tests=warn --partition slice:${{ matrix.slice }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit-game-${{ matrix.slice }}
          path: target/nextest/ci/junit.xml

  # The parity scenarios in three parts side by side (VANILLITE_SCENARIO_SHARD: every third
  # scenario in name order, so the parts together run all of them). Part 1 also runs the other
  # tests of the harness, parts 2 and 3 only the parity test binary.
  test-parity:
    name: Tests (parity scenarios ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        include:
          - shard: 1
            filter: all()
          - shard: 2
            filter: binary(parity)
          - shard: 3
            filter: binary(parity)
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      VANILLITE_SCENARIO_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      # The Vanilla data the build extracts from Mojang's server jars (#213): the current version
      # and the older ones of vanillite-multiversion, restored instead of extracted again (about
      # 2.5 min per job). Only the codegen job saves it: it extracts every pinned version, so the
      # entry is complete (a job that saved first could leave the older versions out).
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vanillite/vanilla-data
          key: vanilla-data-v2-${{ hashFiles('data/**/version.toml', 'tools/extractor/src/**/*.java', 'crates/vanillite-datagen/src/**') }}
          restore-keys: vanilla-data-v2-
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}
      # The workspace crates through sccache (GitHub cache): crates a change does not touch, above
      # all the optimised world generation, come from the cache instead of being rebuilt.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # The Vanilla data pack the tests extract from the pinned server jar. After rust-cache so
      # that its post step saves before rust-cache cleans target/ (which drops this directory).
      - uses: actions/cache@v4
        with:
          path: target/vanilla-cache
          key: vanilla-pack-${{ hashFiles('data/vanilla/version.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The scenarios tick mobs in chunk levels: with the world crate at opt-level 1 they run
      # about a third faster for no longer build. Same code and the same checks: debug
      # assertions and overflow checks stay on.
      - name: Tests
        run: >-
          cargo nextest run -p vanillite-test --all-features --locked --profile ci --no-tests=warn
          --config 'profile.dev.package.vanillite-world.opt-level=1' -E '${{ matrix.filter }}'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit-parity-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml

  codegen:
    name: Doc tests and codegen
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      # The Vanilla data the build extracts from Mojang's server jars (#213). This job saves the
      # entry the other jobs restore: `cargo xtask codegen --check` extracts the current and every
      # older pinned version, so the entry is complete.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vanillite/vanilla-data
          key: vanilla-data-v2-${{ hashFiles('data/**/version.toml', 'tools/extractor/src/**/*.java', 'crates/vanillite-datagen/src/**') }}
          restore-keys: vanilla-data-v2-
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}
      # The workspace crates through sccache (GitHub cache): crates a change does not touch, above
      # all the optimised world generation, come from the cache instead of being rebuilt.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # The Vanilla data pack the tests extract from the pinned server jar. After rust-cache so
      # that its post step saves before rust-cache cleans target/ (which drops this directory).
      - uses: actions/cache@v4
        with:
          path: target/vanilla-cache
          key: vanilla-pack-${{ hashFiles('data/vanilla/version.toml') }}
      - name: Generated code is current
        run: cargo xtask codegen --check
      - name: Pterodactyl egg is current
        run: cargo xtask egg --check
      - name: Parity goldens are current
        run: cargo xtask golden check
      - name: Doc tests
        run: cargo test --workspace --all-features --locked --doc

  test-worldgen:
    name: Tests (world generation ${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two parts of about equal length: the slowest golden binaries and all the rest (the
      # complement, so a new test always runs in exactly one part).
      matrix:
        part: [structures, rest]
        include:
          - part: structures
            filter: binary(structure_goldens) | binary(large_structure_goldens)
          - part: rest
            filter: not (binary(structure_goldens) | binary(large_structure_goldens))
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      # The Vanilla data the build extracts from Mojang's server jars (#213): the current version
      # and the older ones of vanillite-multiversion, restored instead of extracted again (about
      # 2.5 min per job). Only the codegen job saves it: it extracts every pinned version, so the
      # entry is complete (a job that saved first could leave the older versions out).
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vanillite/vanilla-data
          key: vanilla-data-v2-${{ hashFiles('data/**/version.toml', 'tools/extractor/src/**/*.java', 'crates/vanillite-datagen/src/**') }}
          restore-keys: vanilla-data-v2-
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}
      # The workspace crates through sccache (GitHub cache): crates a change does not touch, above
      # all the optimised world generation, come from the cache instead of being rebuilt.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      - uses: actions/cache@v4
        with:
          path: target/vanilla-cache
          key: vanilla-pack-${{ hashFiles('data/vanilla/version.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: >-
          cargo nextest run -p vanillite-worldgen --all-features --locked --profile ci --no-tests=warn
          -E '${{ matrix.filter }}'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit-worldgen-${{ matrix.part }}
          path: target/nextest/ci/junit.xml

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      # Prebuilt binary instead of the action's container build; same command as the action's
      # defaults.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --log-level warn --all-features check
