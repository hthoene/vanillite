[package]
name = "vanillite-worldgen"
description = "Vanilla world generation as a library: noise, density functions, biomes, surface rules, carvers, features and structures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Gzip of structure template files (`data/<ns>/structure/**.nbt`).
libdeflater.workspace = true
rustc-hash.workspace = true
# Doubles parsed correctly rounded, as Java does (the default parser can be one ulp off for 17
# digits; the structure goldens need it). A normal, not a dev-dependency feature: one only for
# tests would make `cargo test` recompile every crate that uses serde_json.
serde_json = { workspace = true, features = ["float_roundtrip"] }
vanillite-base.workspace = true
vanillite-chunk.workspace = true
vanillite-data.workspace = true
vanillite-datapack.workspace = true
vanillite-nbt.workspace = true

[dev-dependencies]
# Reads Vanilla worlds in the comparison test.
vanillite-storage.workspace = true

[lints]
workspace = true
