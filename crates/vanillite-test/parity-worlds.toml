# The parity world corpus (#244): complex real-world worlds and schematics that
# `cargo xtask parity worlds` runs in Vanilla and in Vanillite and compares tick by tick.
#
# Nothing of these files is in the repository: they are downloaded into
# ~/.cache/vanillite/parity-worlds/<name>/ and checked against `sha256`. Every entry says where
# it comes from, under which licence and what it holds.
#
# Fields:
# - name: snake_case, the scenario name (known divergences: scenarios/divergences/<name>.toml).
# - group: the subsystem it mostly exercises (redstone, pistons, tnt, hoppers, mobs, farms,
#   villagers, entities), for handing divergences to the right owner.
# - url, sha256: a direct download (pinned to a commit where possible).
# - format: litematic, schem, schematic, nbt or world (a zip with level.dat); default from the
#   url's extension. world_path: the folder with level.dat inside the zip (default: the
#   shallowest one).
# - licence, source, contents: where it comes from and what it holds.
# - region: the observed box [[x, y, z], [x, y, z]] (inclusive, absolute). Default for
#   schematics: the pasted box and 2 blocks around it. Schematics are pasted with their
#   minimum corner at 0 0 0 into a void world (plains biome, no structures).
# - trigger: without actions, every lever of a schematic flips at trigger_tick (default 20;
#   "none" turns it off). snapshot_entities (default true): the world's own entities (minecarts,
#   villagers, mobs) load with its chunks.
# - ticks (default 1200), rules (game rules as in scenarios), difficulty, seed (default 0;
#   chunks outside the saved area are generated from it).
# - actions, entities: scenario actions and entities (crates/vanillite-test/src/scenario.rs),
#   e.g. {tick = 20, op = "place", pos = [3, 1, 0], block = "minecraft:redstone_block"} to
#   press the input. For schematics `pos`, `from` and `to` are relative to the pasted corner.
# - player: where the scripted player (survival, named "player") stands, [x, y, z] (relative
#   for schematics), or "none". Default: a world's saved player position, or on a barrier block
#   next to a schematic's minimum corner (out of the region). Actions use it by that name; the
#   default trigger also makes it press every button of a schematic.
# - Every world runs with random ticks (random_tick_speed 3) and mob spawning (spawn_mobs) like a
#   server, unless rules say otherwise. summary.md flags a world in whose region nothing changes
#   (no block, block entity or entity count) as inactive.

