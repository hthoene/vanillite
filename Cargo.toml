[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "tools/loadbot", "tools/microbench", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Hannes Thöne"]
repository = "https://github.com/hthoene/vanillite"
homepage = "https://vanillite.org"

[workspace.dependencies]
# Internal crates.
microbench = { path = "tools/microbench" }
vanillite-abi = { path = "crates/vanillite-abi", version = "0.1.0-beta.3" }
vanillite-base = { path = "crates/vanillite-base", version = "0.1.0-beta.3" }
vanillite-bedrock = { path = "crates/vanillite-bedrock", version = "0.1.0-beta.3" }
vanillite-chunk = { path = "crates/vanillite-chunk", version = "0.1.0-beta.3" }
vanillite-command = { path = "crates/vanillite-command", version = "0.1.0-beta.3" }
vanillite-config = { path = "crates/vanillite-config", version = "0.1.0-beta.3" }
vanillite-data = { path = "crates/vanillite-data", version = "0.1.0-beta.3" }
vanillite-datagen = { path = "crates/vanillite-datagen", version = "0.1.0-beta.3" }
vanillite-datapack = { path = "crates/vanillite-datapack", version = "0.1.0-beta.3" }
vanillite-game = { path = "crates/vanillite-game", version = "0.1.0-beta.3" }
vanillite-light = { path = "crates/vanillite-light", version = "0.1.0-beta.3" }
vanillite-macros = { path = "crates/vanillite-macros", version = "0.1.0-beta.3" }
vanillite-multiversion = { path = "crates/vanillite-multiversion", version = "0.1.0-beta.3" }
vanillite-nbt = { path = "crates/vanillite-nbt", version = "0.1.0-beta.3" }
vanillite-net = { path = "crates/vanillite-net", version = "0.1.0-beta.3" }
vanillite-plugin = { path = "crates/vanillite-plugin", version = "0.1.0-beta.3" }
vanillite-plugin-host = { path = "crates/vanillite-plugin-host", version = "0.1.0-beta.3" }
vanillite-protocol = { path = "crates/vanillite-protocol", version = "0.1.0-beta.3" }
vanillite-proxy = { path = "crates/vanillite-proxy", version = "0.1.0-beta.3" }
vanillite-server = { path = "crates/vanillite-server", version = "0.1.0-beta.3" }
vanillite-storage = { path = "crates/vanillite-storage", version = "0.1.0-beta.3" }
vanillite-test = { path = "crates/vanillite-test", version = "0.1.0-beta.3" }
vanillite-world = { path = "crates/vanillite-world", version = "0.1.0-beta.3" }
vanillite-worldgen = { path = "crates/vanillite-worldgen", version = "0.1.0-beta.3" }

# External crates.
bumpalo = { version = "3.20", features = ["collections"] }
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
libloading = "0.8"
log = { version = "0.4", features = ["std"] }
md5 = { package = "md-5", version = "0.11", default-features = false }
rustc-hash = "2.1"
serde_json = "1"
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
toml = "1"

# External crates: storage (vanillite-storage).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
zstd = { version = "0.13", default-features = false }

# External crates: network (vanillite-nbt, vanillite-protocol, vanillite-macros, vanillite-net).
aes = "0.8"
libdeflater = "1.26"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
env_logger = { version = "0.11", default-features = false }
rsa = { version = "0.10", features = ["pkcs1v15"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

# Workspace-wide lints. Input-handling crates (SEC-07) repeat these in their own
# `[lints]` tables and add the SEC-07 deny set, because Cargo cannot extend
# `workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Build profiles. See `docs/development.md` for when to use which.
[profile.dev]
# Line tables keep backtraces and debuggers useful at a fraction of the link time.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Dependencies are built once (and shared through sccache); optimise them so tests and
# `cargo xtask dev` run at a useful speed.
opt-level = 3
debug = false

# World generation is bit-exact floating point work; its parity tests run optimised (section 10.3).
[profile.dev.package.vanillite-worldgen]
opt-level = 3

# The light engine recomputes whole chunk areas; its parity tests and scenarios run optimised.
[profile.dev.package.vanillite-light]
opt-level = 3

# Block data, data pack loading, chunk storage and NBT sit in the inner loops of the world
# generation and structure goldens; unoptimised they make those tests about three times slower.
[profile.dev.package.vanillite-data]
opt-level = 3

[profile.dev.package.vanillite-datapack]
opt-level = 3

[profile.dev.package.vanillite-chunk]
opt-level = 3

[profile.dev.package.vanillite-base]
opt-level = 3

[profile.dev.package.vanillite-nbt]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Optimised build for quick iteration (test server deploys, local measurements):
# close to release speed, a fraction of its build time.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# Release code generation with symbols, for perf, flamegraphs and heaptrack.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
